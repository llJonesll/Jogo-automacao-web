formulas:
  belt_throughput:
    expression: "TICK_HZ / ceil(belt_slot_spacing / min(1.0, base_belt_speed * belt_speed_mult * overdrive_mult * DT))"
    variables: ["base_belt_speed", "belt_speed_mult", "overdrive_mult", "DT", "TICK_HZ", "belt_slot_spacing"]
    output_range: "2.0..20.0 items/s"
    source: "design/gdd/factory-systems.md#1-belt--splittermerger-throughput-belt_throughput"
    referenced_by: ["src/game/simulation.ts", "tests/unit/logistics.test.ts"]

  tunnel_transit:
    expression: "base_tunnel_speed * belt_speed_mult * overdrive_mult * DT"
    variables: ["base_tunnel_speed", "belt_speed_mult", "overdrive_mult", "DT", "tunnel_slot_spacing"]
    output_range: "0.10..1.0 progress/tick (4.0..20.0 items/s)"
    source: "design/gdd/factory-systems.md#2-underground-tunnel-transit-tunnel_transit"
    referenced_by: ["src/game/simulation.ts", "tests/unit/logistics.test.ts"]

  miner_extraction:
    expression: "base_miner_speed * clock * (1 + geo_bonus) * mining_speed_mult * overdrive_mult * satisfaction"
    variables: ["base_miner_speed", "clock", "geo_bonus", "mining_speed_mult", "overdrive_mult", "satisfaction"]
    output_range: "0.0..45.56 ores/s"
    source: "design/gdd/factory-systems.md#3-mining-extraction-rate-miner_extraction"
    referenced_by: ["src/game/simulation.ts", "tests/unit/production.test.ts"]

  machine_craft_rate:
    expression: "(1 / recipe_seconds) * clock * (1 + geo_bonus) * craft_speed_mult * overdrive_mult * satisfaction"
    variables: ["recipe_seconds", "clock", "geo_bonus", "craft_speed_mult", "overdrive_mult", "satisfaction"]
    output_range: "0.0..25.31 crafts/s"
    source: "design/gdd/factory-systems.md#4-overclock-power--cycle-speed-overclock_power-machine_craft_rate"
    referenced_by: ["src/game/simulation.ts", "tests/unit/production.test.ts"]

  overclock_power:
    expression: "is_active ? base_power_mw * (clock ^ 1.6) : base_power_mw * 0.05"
    variables: ["base_power_mw", "clock", "is_active", "idle_power_fraction", "overclock_exponent"]
    output_range: "0.02..51.96 MW"
    source: "design/gdd/factory-systems.md#4-overclock-power--cycle-speed-overclock_power-machine_craft_rate"
    referenced_by: ["src/game/power.ts", "src/ui/hud.ts", "tests/unit/power-tech.test.ts"]

  solar_factor:
    expression: "day_ratio < 0.70 ? sin(pi * (day_ratio / 0.70)) : 0"
    variables: ["day_ratio", "day_ratio_threshold"]
    output_range: "0.0..1.0"
    source: "design/gdd/factory-systems.md#5-grid-satisfaction-solar-factor--accumulator-balance-solar_factor-grid_satisfaction"
    referenced_by: ["src/game/power.ts", "tests/unit/power-tech.test.ts"]

  grid_satisfaction:
    expression: "demanded_mw > 0 ? min(1.0, (generated_mw + discharge_mw) / demanded_mw) : 1.0"
    variables: ["generated_mw", "discharge_mw", "demanded_mw"]
    output_range: "0.0..1.0"
    source: "design/gdd/factory-systems.md#5-grid-satisfaction-solar-factor--accumulator-balance-solar_factor-grid_satisfaction"
    referenced_by: ["src/game/power.ts", "src/game/simulation.ts", "tests/unit/power-tech.test.ts"]

  lab_research_rate:
    expression: "base_lab_speed * clock * (1 + geo_bonus) * craft_speed_mult * overdrive_mult * satisfaction"
    variables: ["base_lab_speed", "clock", "geo_bonus", "craft_speed_mult", "overdrive_mult", "satisfaction"]
    output_range: "0.0..50.625 cycles/s (2x science per item)"
    source: "design/gdd/factory-systems.md#7-research-lab-science-rate-lab_research_rate"
    referenced_by: ["src/game/progression.ts", "tests/unit/power-tech.test.ts"]

