project:
  name: "AETHERFORGE: Orbital Foundry"
  stage: "Release"
  goal: "portfolio"

engine:
  name: "Web"
  version: "6.2.0"
  language: "TypeScript"
  rendering: "Canvas 2D"
  physics: "none"

modes:
  rigor: "standard"
  workflow: "standard"
  automation: "autonomous"

workflow_overrides:
  tuning_knobs: true

performance:
  target_framerate: 60
  frame_budget_ms: 16.67
  tick_budget_ms: 2.0
  draw_call_limit: 1500
  memory_ceiling_mb: 128

platform:
  targets: ["Web"]
  primary_input: "keyboard_mouse"
  gamepad_support: "Full"
  touch_support: "Partial"
  multiplayer: false
  online: false
  cert_tier: "none"

naming:
  classes: PascalCase
  variables: camelCase
  constants: SCREAMING_SNAKE
  signals: on_event_name
  files: kebab-case

commands:
  build: "npm run build"
  test: "npm test"
  run: "npm run dev"
