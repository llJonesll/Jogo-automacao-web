name: Bug Report
description: Report a simulation, logistics, UI, or rendering bug in AETHERFORGE
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened vs. what you expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we trigger this consistently (seed, blueprint, or save JSON)?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Tag
      placeholder: "v1.0.0"
